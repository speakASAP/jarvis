apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jarvis-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jarvis-secret
    creationPolicy: Owner
  data:
    # PostgreSQL: dedicated database `jarvis`, least-privilege role `jarvis_app`
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/jarvis
        property: DATABASE_URL

    # MinIO: credentials scoped to the private bucket `jarvis-raw` only
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: secret/prod/jarvis
        property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: secret/prod/jarvis
        property: MINIO_SECRET_KEY

    # No client id/secret: this Auth has no OAuth client credential on the
    # application record. Hosted Auth identifies the app by its registered
    # `name` and `domain` (jarvis / jarvis.alfares.cz), and the user-facing flow
    # is validated with AUTH_SERVICE_TOKEN like every other call. Verified
    # against screencast-recorder, the reference user_facing app, which holds no
    # client credential either.

    # S2S: one credential per (caller -> target) pair.
    # auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: AUTH_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/jarvis
        property: AUTH_SERVICE_TOKEN
    - secretKey: AI_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/jarvis
        property: AI_SERVICE_TOKEN
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/jarvis
        property: LOGGING_SERVICE_TOKEN
    - secretKey: NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/jarvis
        property: NOTIFICATIONS_SERVICE_TOKEN
